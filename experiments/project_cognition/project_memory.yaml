    declaration would produce, so every rule was optional to a producer that declined to
    declare an effect.
  evidence_for:
    - "HML 8bcd9a5 (fix: the frame condition): a claim asserting '0 = 1' with status VERIFIED, materialising with no evidence, warrant or epistemic effect, was VALID at 7c9137a. So was an existing premise rewritten ASSUMED->VERIFIED with its proposition changed; a candidate walked PROPOSED->VERIFIED and from the terminal REJECTED by writing candidate_effect kind NONE with zero constraints checked; and a mandatory OPEN obligation deleted outright."
    - "One unrelated 'status: UNKNOWN' claim appended to a corrupted transition flipped 10/10 ILLEGAL acceptance fixtures to UNRESOLVED. UNRESOLVED counts as neither accepted nor detected, so this was a complete detection bypass available to anyone who could append a record nothing cites. Measured 0/10 after repair."
