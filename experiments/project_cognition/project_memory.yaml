# Project cognition ledger — dormant ideas, rejected hypotheses, conditional
# strategies, negative results, and activation cues.
#
# THIS FILE DOES NOT REPLACE THE FIVE CANONICAL DOCUMENTS.
#   docs/00_HML_MASTER.md · docs/01_STATE_AND_EXECUTION.md
#   docs/02_SEARCH_AND_DISCOVERY.md · docs/03_MEANING_EVIDENCE_AND_VERIFICATION.md
#   docs/04_INTEGRATION_AND_IMPLEMENTATION.md
# Those remain canonical and integrator-owned. This file preserves the material that
# those documents deliberately compress away: things parked, things killed, things
# conditionally planned, and the exact conditions that should wake them.
#
# RULES OF USE
#   * IDs X1..Xn are PERMANENT. Never renumber. Never reuse a retired id.
#   * Every entry must trace to a real artifact. No entry may be added to inflate a count.
#   * An entry whose evidence disappears is marked status: unresolved with the loss
#     recorded in evidence_against, never silently deleted.
#   * Claims that the surrounding project repeats but the repositories do not support
#     are recorded as DISCREPANCY entries (type: risk, project: cross) with the
#     contradicting evidence in evidence_against.

