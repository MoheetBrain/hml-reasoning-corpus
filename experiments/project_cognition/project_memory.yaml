- id: X133
  type: negative_result
  proposal: "A 30/30 pass against the frozen reference checker concealed two real divergences, one unsafe — fixture agreement is not oracle agreement."
  origin: "/Users/moheet/hml_v2_worktree/docs/agent_handoffs/CLAUDE_SEMANTIC_FIREWALL_CLOSEOUT.md §3 and §7; /Users/moheet/hml_v2_worktree/docs/hml_v2/SEMANTIC_STATE_CONTRACT.md §5a; both at HML 7c9137a."
  reason: "This is a methodological result about the corpus's own acceptance instrument and it outlives the code change that produced it. The Semantic Firewall's 30 fixtures are the corpus's acceptance criteria for any HML claim of firewall support (X21). An implementation passing all 30, on both verdict AND error class, was nonetheless diverging from reference_checker.py in three places. Two were repaired at 7c9137a: input-domain checking moved from equality to a containment walk over the domain lattice, and the warrant premise envelope moved from a subset test to exact list equality. The fixtures could not see either, because every fixture declares the domain its claim already has and every fixture's premise envelope already equals its dependency list. The second divergence failed in the UNSAFE direction — evidence resting on fewer premises than the action declared was accepted, letting a conclusion acquire ancestry its warrant never covered. Both were found by reading the oracle's source; no amount of running the fixtures would have surfaced either. A third divergence is KEPT and unresolved: this verifier checks action.typing.output_domain, which the reference never reads. That one is a corpus judgement and is recorded rather than resolved."
  status: unresolved
  project: cross
  activation_cues:
    - "THE DECISION THE CORPUS OWNS AND HAS NOT MADE: whether to add the two fixtures that would make the repairs externally detectable. Named in the closeout as a LEGAL case whose claim is Natural where the action requires Integer (reference: VALID), and an ILLEGAL case whose warrant evidence binds a strict subset of the action's dependencies (reference: INVALID, WARRANT_MISMATCH). Until then nothing external catches a regression in either repair."
    - "THE SECOND DECISION THE CORPUS OWNS: whether output_domain is a gap in reference_checker.py or over-strictness in the implementation. It cannot be settled from the HML side."
    - "Any acceptance set anywhere in this programme is treated as sufficient because it passes. Ask what the set cannot distinguish."
  dependencies: [X21]
  evidence_for:
    - "CLAUDE_SEMANTIC_FIREWALL_CLOSEOUT.md §7: 'A 30/30 pass rate against an external frozen checker concealed two real defects, one of them in the unsafe direction. Agreement with an oracle on the cases the oracle happens to contain is not agreement with the oracle.'"
    - "SEMANTIC_STATE_CONTRACT.md §5a table: input domain was 'claim.domain != required', reference uses _is_subtype over _DOMAIN_PARENTS, now inhabits() over the lattice; warrant premises were 'premise_ids subset of dependencies', reference uses '==', now exact list equality."
    - "AUDIT PASS 2, verified in git: commit 7c9137a's message records 'lattice vs frozen reference _is_subtype, full cross product: 0 disagreements' and '30 acceptance fixtures vs frozen reference checker: 30/30 verdict and error class, unchanged by the repairs'. The repairs changing no verdict is the finding, not a reassurance."
  evidence_against:
    - "No fixture, no freeze_manifest.json and no line of reference_checker.py was modified from the HML side, so the corpus's frozen instrument is intact and this result does not impeach the 80/80 FINAL benchmark in X21."
    - "The differential test now standing between a regression and silence lives in the HML repository and tests against a file that repository does not own. That is a fragile arrangement and is the reason the fixture decision matters."
  related: [X21, X22, X78, X79, X129]

