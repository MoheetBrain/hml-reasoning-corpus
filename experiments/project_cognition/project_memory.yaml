    - "CORRECTION OF A DEMONSTRABLE FACTUAL ERROR IN THIS ENTRY'S OWN TITLE, made by audit pass 3 on 2026-08-10 and recorded here rather than hidden. The original title read: 'Post-build audit of HML 7c9137a found six accepted transitions that should have been refused; five repaired, one classified BLOCKER'. Two things in it are wrong against the artifacts. FIRST, only FIVE of the six probes were ACCEPTED (returned VALID); the sixth was the appended-UNKNOWN case, which returned UNRESOLVED and is a detection bypass, not an acceptance. DECISIONS.md D-049's own header says 'Closes: five confirmed acceptance defects', and the HML PROJECT_LEDGER entry says 'five of six ran in the unsafe direction'. SECOND, and more misleading, ALL SIX were repaired — D-049's Verification reads 'All six probes above now INVALID or ineffective; the UNKNOWN suppression measured 0/10 against 10/10 before', and the ledger's verification table records 'the six audit probes, re-run: 6/6 now INVALID or ineffective'. The BLOCKER is D-050, the trust boundary, which is a SEPARATE finding and was never one of the six probes. Reading the original title, a fresh agent would look for an unrepaired sixth probe that does not exist and would miss that the real blocker is unrelated to the frame condition. The body text and every evidence item are unchanged; only the title was corrected. Note that the HML repository's own ledger heading carries the same imprecision ('six accepted transitions'; 'Six defects confirmed, five repaired'), so this is an inherited error, not one this ledger invented."
