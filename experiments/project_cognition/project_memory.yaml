- id: X136
  type: architecture
  project: cross
  status: implemented
  title: "The frame condition — a verifier must check that S_t+1 is a legal application of the DECLARED transition, not merely that each declared effect is individually legal"
  summary: >
    Undeclared mutation is invalid. state_after must be state_before plus exactly what the
    action produces; existing records are unchanged unless a DECLARED effect licenses the
    change, and then that effect's own invariant decides whether the change was legitimate.
    Without this rule every other rule is optional, because every other rule is keyed on the
    declaration — a producer that simply declines to declare an effect is never checked. This
    is the most important structural lesson the semantic-state work produced, and it
    generalises past HML to any state-transition verifier this programme ever writes.
  evidence_for:
    - "/Users/moheet/hml_v2_worktree/DECISIONS.md D-049, dated 2026-08-10, after 7c9137a, spec reference reference_checker.py::_exact_state_change. Its statement of the root cause is the load-bearing sentence: 'The ten invariants all examine what the action DECLARES. Not one of them examined whether the resulting state is what applying that declaration to the prior state would produce. There was no frame condition. Every other rule was therefore optional.'"
    - "SIX PROBES, and the precise counts matter because they are easy to misquote. FIVE returned VALID at 7c9137a and should have been refused: a claim asserting 0 = 1 with status VERIFIED materialising with no evidence, no warrant and no epistemic effect; an existing premise rewritten ASSUMED -> VERIFIED with its proposition changed; a candidate walked PROPOSED -> VERIFIED by writing candidate_effect kind NONE, skipping the constraint-subset rule entirely; the same walk from the terminal REJECTED state; and a mandatory OPEN obligation deleted outright. The SIXTH is not an acceptance — appending one unrelated status: UNKNOWN claim flipped 10/10 ILLEGAL fixtures to UNRESOLVED, a detection bypass, since UNRESOLVED counts as neither accepted nor detected. All six were reproduced against pristine production code BEFORE anything was changed."
    - "THE FROZEN CORPUS REFERENCE HAS CARRIED THIS ALL ALONG and it was simply not ported: /Users/moheet/Documents/ChatGPT/hmlt-reasoning-corpus/experiments/semantic_firewall/reference_checker.py defines _exact_state_change at line 479 and calls it at line 118. Verified directly in the corpus tree by audit pass 3, not taken from the HML write-up. The rule was available to be copied for the entire life of the implementation."
    - "REPAIRED at HML 8bcd9a5. Checked LAST so a more specific invariant claims the error class first; reported as DEPENDENCY_VIOLATION, which is where the reference reports it (verify.py maps FRAME -> DEPENDENCY_VIOLATION at line 71, _check_frame at line 772, _licensed_change at line 825). Extended DELIBERATELY BEYOND THE REFERENCE to candidates, branches and obligations, because the reference frames claims only and three of the six probes are accepted by the reference too. Verification recorded in D-049 and the HML ledger: 30/30 acceptance fixtures unchanged, the six probes 6/6 now INVALID or ineffective, UNKNOWN suppression 0/10 against 10/10 before, mutation test with the frame disabled caught, pytest 7268 passed / 0 failed, frozen core diff empty."
    - "Additionally: unknowns are now DEPENDENCY-SCOPED. Only records the action actually cites — its dependencies, its output, the claims it types, the candidate and branches its effects name — can make a transition UNRESOLVED. Unscoped, the rule was not fail-closed but a denial of service."
  evidence_against:
    - "NO FIXTURE COULD HAVE CAUGHT ANY OF IT, and that is a finding about the corpus's own instrument. All thirty acceptance fixtures are well-formed records whose delta already matches their action, so a verifier with no frame condition passes every one. The corpus owns the fixtures; it is the only party that can close this, and the proposed FX2-* probe suite is still undecided."
    - "THE FRAME CONDITION MAKES THE STATE DELTA HONEST AND DOES NOTHING ABOUT SELF-ASSERTED EVIDENCE. D-050 is explicit: EvidenceRecord.status is read from the imported record, the sole writer is neutral.py:307 payload.get('status', 'UNKNOWN'), nothing in src/ ever produces a VALID evidence status, and semantic_state imports nothing from reasoning/certificates/ where the real trust machinery lives. A producer that authors the transition still authors the verdict. That is a separate BLOCKER, not a residue of this one."
    - "One known divergence retained rather than repaired: the reference runs every check and only then asks whether anything was unknown, so on a transition carrying BOTH a violation and an unknown the reference says INVALID and this verifier says UNRESOLVED. Matching it was attempted and reverted — it requires each check to skip unknown values individually rather than the verdict short-circuiting, and could not be validated against thirty fixtures that never exercise it."
  activation_cue: >
    Wake whenever any new verifier, checker or acceptance harness is written anywhere in this
    programme, and ask one question of it: does it check that the transition HAPPENED, or only
    that it was DESCRIBED? A checklist over declared effects is not a verifier. Wake also
    before any model-authored transition reaches semantic_state.verify — the frame condition
    is necessary and is NOT sufficient, because D-050 remains open.
  related: [X21, X78, X79, X133, X134, X138]

- id: X137
  type: finding
  project: cross
  status: proposed
  title: "The state effect outranks the operation label — a tactic name carries only 24% of the information about what it does"
  summary: >
    Canonical semantics live in the state delta, the dependencies, the effect channels, the
    warrant and the evidence. The operation label may remain as provenance or interface, but it
    must not be where meaning is looked up. This is the largest single measurement in the
    three-source audit and it points at a field HML already has.
  evidence_for:
    - "/Users/moheet/hml_v2_worktree/reports/FINAL_THREE_SOURCE_HML_PROPOSAL.md F-2: MI(head ; effect) / H(head) = 0.240 over 259,580 LeanDojo proof steps. Only 24% of the information in a tactic name is about what it does to the state; the other 76% is warrant, backend selection and search policy."
    - "THE CLEAN DEMONSTRATION, and the reason this is not a statistical artefact. rw is the commonest tactic at 48,991 occurrences. It transforms the TARGET in only 50.3% of them; it CLOSES THE GOAL in 34.5% (Lean tries rfl afterwards); it rewrites a HYPOTHESIS in 11.7%; and it SPLITS in about 3%. The intuitive decomposition 'rw = TRANSFORM target' is wrong slightly more than half the time."
    - "SURFACE SYNTAX ALONE CAN INVERT THE SIGNATURE: induction is 74% DISCHARGE while its port induction' is 83% SPLIT. Same mathematics, opposite state effect, distinguishable only by a trailing apostrophe."
    - "HML ALREADY EXHIBITS THE CONFLATION THIS WOULD PREVENT. Action.operation is a bare str with no enum and no validation — verified by audit pass 3 in /Users/moheet/hml_v2_worktree/src/hamiltonian_lang/semantic_state/model.py, class Action at line 266, operation: str at line 270. The wider corpus already puts four different kinds of thing in that one field: NUMBER_THEORY, NOTATION and COMBINATORIAL_REASONING are subject tags; modus_ponens is a warrant; differentiate_reciprocal is a backend call; DERIVE is a state effect."
    - "P-01 recommendation is TEST_FIRST and the change is CONTRACT ONLY — operation becomes provenance, the five *_effect dicts become the semantic primary, no new field, full back-compat, size S. Its acceptance test is precise and cheap: a fixture whose operation is a subject tag must verify IDENTICALLY to one whose operation is DERIVE with the same effects, which proves operation carries no semantics."
  evidence_against:
    - "SINGLE SOURCE. Lean's tactic vocabulary is not HML's, and the report says so plainly: HML's own corpus uses only three operations across 630 records, so the conflation is currently LATENT, not active."
    - "The alternative reading, recorded in P-01 and not dismissed: operation may already be de facto provenance, since verify.py keys on it only for VERIFY_CANDIDATE and JOIN_BRANCHES. If so this is documentation, not architecture."
    - "The 42x compression that makes the six effect classes meaningful is measured over PRETTY-PRINTED Lean states. Metavariable context, universe levels, instance cache, goal ordering and elided terms never reach the dataset."
  activation_cue: >
    Wake when any operation vocabulary is proposed, extended, or frozen — in HML, in
    ontology-v1, or in a planner. The test to apply before adding a label: does knowing this
    label tell you what happens to the state? If MI/H is near 0.24 the label is provenance and
    belongs beside the transition, not inside its semantics. Wake also if Action.operation is
    ever constrained to a closed set, since that is the moment the contract change becomes
    load-bearing rather than documentary.
  related: [X2, X15, X17, X100, X127, X148]

- id: X138
  type: dormant_option
  project: cross
  status: deferred
  title: "Declared in-place transformation — the frame condition must distinguish undeclared mutation (INVALID) from declared certified revision (VALID)"
  summary: >
    Real formal systems change the proposition attached to a continuing identity, and it is not
    rare: 8.12% of Lean steps. The frame condition shipped at 8bcd9a5 currently has no licensed
    case for this, so a legitimate move that is one step in twelve of real formal mathematics
    is a DEPENDENCY_VIOLATION with no legal encoding. If it is admitted it must preserve
    ancestry and never silently destroy the prior proposition.
  evidence_for:
    - "/Users/moheet/hml_v2_worktree/reports/FINAL_THREE_SOURCE_HML_PROPOSAL.md P-02: TRANSFORM_CONTEXT 5.41% plus TRANSFORM_BOTH 2.71% = 8.12% of 259,580 LeanDojo steps, n = 21,097. The tactic replace is 98% TRANSFORM_CONTEXT; rw ... at h accounts for 11.7% of all rw uses."
    - "THE CONFLICT IS EXACT AND CURRENT. Claim is frozen=True (model.py:161-162, verified by audit pass 3), and _check_frame rejects any altered prior record unless a declared effect licenses the change, while _licensed_change licenses only SCOPE effects for claims. So the transition is presently unencodable, not merely unimplemented."
    - "The proposal, if taken, mirrors machinery that already exists: a claim_effect channel {kind: TRANSFORM, claim_id, warrant, evidence_id}, licensed by _licensed_change, with its own invariant checking that the new proposition follows from the old under the cited warrant. Mirrors candidate_effect and branch_effect exactly; no new object; additive."
    - "Its acceptance test is already written and is three-sided: rewriting h : a = b to h : b = a under symmetry verifies VALID; the same without a warrant is INVALID; and the frame condition still rejects an UNDECLARED mutation. The third clause is the one that matters — this must not become a hole in X136."
  evidence_against:
    - "SINGLE SOURCE, and the source names its own alternative as possibly correct. P-02: 'Model it as EXTEND + retire-old, i.e. never mutate. This is semantically cleaner and costs a claim per rewrite. This alternative may well be correct and should be considered before implementing mutation.'"
    - "Lean's hypothesis rewriting may be an artefact of tactic-mode ergonomics rather than mathematical necessity. A derived new claim is always EXPRESSIBLE; it is merely less concise. 8.12% measures how often Lean users find mutation convenient, not how often mathematics requires it."
    - "HML's own corpus contains NO such transition, so nothing external would test an implementation. Risk is recorded as M for one specific reason: it touches the frame condition, the one rule that made every other rule enforceable."
  activation_cue: >
    Wake when a real transition — from Gold-10, Gold-125, an adapter, or any future corpus —
    cannot be encoded without either mutating a frozen Claim or minting a duplicate claim that
    loses the original's identity. Before writing any code, build the mutate-versus-retire
    fixture and decide from it: that ordering is P-02's own recommendation and is what stops
    the frame condition acquiring a licensed hole on a convenience argument.
  related: [X136, X78, X79, X133, X134]

- id: X139
  type: dormant_option
  project: cross
  status: deferred
  title: "Goal ancestry — a flat goal dict may be insufficient, but the minimum candidate representation is parent_goal_id plus sibling order, NOT a GoalTree"
  summary: >
    Lean case tags compose on 59.59% of steps and only 67.27% of consecutive traced pairs are
    chained, so roughly a third of real proofs are a flattened tree traversal that a
    chain-shaped Transition cannot express. The remedy is deliberately minimal — a parent
    pointer and an order — and it is explicitly a DERIVATION tree, never a search tree.
  evidence_for:
    - "/Users/moheet/hml_v2_worktree/reports/FINAL_THREE_SOURCE_HML_PROPOSAL.md P-03: case tags compose (h_real -> h_real.h_bot) on 59.59% of steps; only 67.27% of consecutive traced pairs satisfy state_after[i] == state_before[i+1]; only 68.32% of proofs are fully linear."
    - "THE HML GAP IS CONCRETE, verified by audit pass 3 in src/hamiltonian_lang/semantic_state/model.py: class Goal at line 218 has exactly id, proposition, status and scope — no parent, no children, no order. SemanticState.goals is a dict[str, Goal] at line 297 and active_scopes is a flat ordered tuple at line 299."
    - "P-03 proposes Goal.parent_id: str | None plus an explicit sibling order, additive if parent_id defaults None, and states the discipline in five words: 'Not a search tree — a derivation tree.' The distinction is the whole point; a search tree would reintroduce exactly the machinery P-07 rejects."
  evidence_against:
    - "SINGLE SOURCE, and the source suspects its own measurement. Lean's tree is partly a TRACER ARTEFACT: LeanDojo traces against the FOCUSED goal, so only 0.61% of steps ever show more than one goal. The tree may be Lean's bookkeeping rather than mathematics."
    - "THE CHEAPER EXPLANATION IS NAMED AND HAS PRIORITY. P-03's alternative reading is that this is the same defect as the sibling-scope bug already found in _check_scope — a premise in branch:a may conclude into branch:b while the mirror image is a SCOPE_LEAK, so the verdicts differ by list position alone. Fixing scope to a tree may subsume the goal tree entirely at a fraction of the cost. The recommended order in §4 is explicit: fix sibling scope FIRST, then re-measure whether a goal tree is still needed. Do not build the tree first."
    - "DISCREPANCY RECORDED BY AUDIT PASS 3, deliberately not smoothed over. The tasking for this entry described the minimum representation as parent_goal_id plus created_by_action. The artifact proposes parent_id plus explicit SIBLING ORDER, and the string created_by_action does not occur anywhere in either repository — grep over all *.md and *.py returns zero hits. A provenance pointer from a goal to the action that created it may well be a good idea; it is NOT what P-03 measured or proposed, and it is recorded here as unsourced rather than adopted."
  activation_cue: >
    Wake AFTER the sibling-scope defect in _check_scope is repaired, and only then re-measure
    whether goal ancestry is still needed. Wake immediately if any real trajectory requires two
    goals to be simultaneously open with a determinate parent relation, since that is the case
    a flat dict provably cannot hold. Do not wake for a search tree, a frontier or a
    backtracking pointer — those are rejected under X146.
  related: [X57, X61, X81, X136, X146]

- id: X140
  type: decision
  project: cross
  status: proposed
  title: "Candidate is not ActionCandidate — different lifecycles, no subtyping path, and the naming must be fixed before a planner exists to get it wrong"
  summary: >
    HML's Candidate is a proposed MATHEMATICAL OBJECT plus the constraints it must satisfy, and
    its REJECTED state is a refutation. A planner's action candidate is a proposed MOVE, and its
    rejection means the move was not chosen — 27% of rejected actions are mathematically true.
    Reusing one word would give one term two lifecycles and let a rejected action be read as a
    refuted object. Never merge them; add no subtyping path.
  evidence_for:
    - "/Users/moheet/hml_v2_worktree/reports/FINAL_THREE_SOURCE_HML_PROPOSAL.md P-04: 'a decision-point alternative is a proposed ACTION; 27% of rejected actions are mathematically true. HML's Candidate is a proposed mathematical object plus the constraints it must satisfy, whose rejection is a refutation.' Measured over PRM800K phase 1: 6,456 decision points, 43,853 candidates, 260 blind-adjudicated."
    - "The corroborating figure from F-3, which is the same phenomenon seen from the other side: 25.8% of MATHEMATICALLY INVALID candidates were rated 0 or +1 by human labelers. Rating and truth are different axes in both directions."
    - "The existing lifecycle this would be confused with is precise and load-bearing: /Users/moheet/hml_v2_worktree/docs/hml_v2/SEMANTIC_STATE_CONTRACT.md §45-58 — PROPOSED -> UNVERIFIED -> VERIFIED, either arm to REJECTED, one generic object, and constraint_ids checked in FULL on promotion because 'checking a subset verifies a different claim than the one made.'"
    - "P-04 is documentation only: size XS, risk L, back-compat full, recommendation IMPLEMENT. It costs nothing and prevents a class of error this project already prohibits elsewhere — /Users/moheet/hamiltonian_lang/CLAUDE.md already maintains a Prohibited conflations list whose entries are enforced by the type system rather than by convention."
  evidence_against:
    - "NOT YET RECORDED ANYWHERE AUTHORITATIVE. Audit pass 3 verified by grep at HML a21fdb7 that the string ActionCandidate occurs in exactly one file — reports/FINAL_THREE_SOURCE_HML_PROPOSAL.md itself — and appears in neither DECISIONS.md nor the prohibited-conflations list in CLAUDE.md, which are the two places P-04 asks for. Status is proposed, not implemented, and this entry is the reminder."
    - "No planner exists, so nothing today can get it wrong. That is the argument FOR recording it now and also the reason it will keep being deferred."
  activation_cue: >
    Wake the moment any planner, action generator, ranker or search component is designed, and
    before it is named. Also wake if anything proposes to reuse Candidate, CandidateStatus or
    the constraint_ids machinery for proposed actions. The concrete discharge is small and
    checkable: a D-0xx record in DECISIONS.md and one line in the prohibited-conflations list,
    stating that action candidates and object candidates are disjoint with no subtyping path.
  related: [X78, X126, X141, X142, X143]

- id: X141
  type: finding
  project: cross
  status: active
  title: "PRM dynamic-k — retire the 'every decision branches into exactly three' intuition; the evidence supports variable and REACTIVE k, not k predicted from difficulty"
  summary: >
    The fixed-branching-factor intuition has no support in the data. What the data shows is a
    reactive expansion policy — sample once, accept if good, expand only after failure — and it
    shows it because that is literally how the corpus was collected. It does NOT establish that
    k can be predicted from problem difficulty beforehand, and it must not be cited for that.
  evidence_for:
    - "/Users/moheet/hml_v2_worktree/reports/FINAL_THREE_SOURCE_HML_PROPOSAL.md §0 correction 2, measured: P(first candidate = +1) is 0.999 at k=1 and 0.049 at k=7. A twentyfold collapse across k."
    - "The mechanism that produces it, stated by the source: 'Labelers sampled once, accepted if Great, and expanded k ONLY AFTER FAILURE. So the multi-candidate corpus is exactly the states where the generator already failed.'"
    - "§5 Q8, the direct answer: 'Fixed-k or dynamic-k? Dynamic, and REACTIVE — expand after a failure, not predicted from difficulty. That is literally how the data was collected.'"
  evidence_against:
    - "THE MOST IMPORTANT CAVEAT, and it cuts against over-reading this entry in the other direction: because k was expanded only after failure, PRM decision points are a CONDITIONED SAMPLE and unconditional rates cannot be read off them at all. The 0.999-to-0.049 curve is evidence about the collection policy at least as much as about the underlying difficulty of the states."
    - "Nothing here licenses predicting k from a difficulty estimate. This project's own history is unusually blunt on that point: every difficulty prediction it has ever made was marked PREDICTED_NOT_MEASURED and carried no signal — X108 records a pre-run mean predicted accuracy of 0.556 against a measured 1.000."
    - "No planner exists in either repository, so there is nothing to set k on."
  activation_cue: >
    Wake if any planner, sampler or search component proposes a fixed branching factor, or
    proposes choosing k from a difficulty estimate. The first is unsupported; the second is
    unsupported AND has a poor track record in this specific project. A reactive policy —
    expand after a failed or unverifiable candidate — is the only shape the evidence backs, and
    even that is inferred from how the data was collected rather than from an experiment.
  related: [X140, X142, X143, X108, X45]

- id: X142
  type: finding
  project: cross
  status: active
  title: "Validity is not action quality — PRM labels mix the two and carry 2.5-4.5% irreproducible noise; but an INVALID action must still never enter trusted state"
  summary: >
    Two separate claims that must not be collapsed. FIRST, as a ranking signal the labels are
    noisy and partly fit the labeler rather than the mathematics, and validity-first
    lexicographic ranking measures WORSE than a soft scalar. SECOND, none of that touches the
    trusted path: generation and ranking may consider an invalid action, and only a VALID one
    may execute into trusted state. The first claim is measured; the second is this project's
    own architectural rule and is not derived from PRM.
  evidence_for:
    - "/Users/moheet/hml_v2_worktree/reports/FINAL_THREE_SOURCE_HML_PROPOSAL.md F-3, blind-adjudicated over 260 candidates with ratings and ground truth hidden until after: 72% of -1s are mathematically wrong, so validity IS the dominant axis for rejection; but 25.8% of mathematically invalid candidates were rated 0 or +1."
    - "MEASURED HEAD TO HEAD, and the direction is counterintuitive: soft scalar picks a +1 at 0.725; validity-first lexicographic at 0.700. LEXICOGRAPHIC IS WORSE. Pruning every invalid candidate destroys the only acceptable option in 5.0% of decision points."
    - "NOISE FLOOR, verified by the auditor at 4.5%: byte-identical candidates, same prefix, same labeler, different rating, 2.5-4.5%. Inter-labeler variation is twofold — one labeler emits 0 at .147 where another emits .358. 'A scalar critic fit to this label is partly fitting labeler identity.' A further 27-38% of matched pairs are unexplained by validity and progress together."
    - "P-05's shape, if anything is ever built: emit (validity, progress) as a VECTOR, keep the combination soft and revisable, and let a validity verdict ORDER candidates rather than delete them. Its acceptance test is pre-written and falsifiable — on held-out PRM decision points the critic must beat the 0.308 random baseline AND beat a validity-only ranker, measured, not assumed."
  evidence_against:
    - "DISCREPANCY RECORDED BY AUDIT PASS 3, because the two halves of this entry come from different places and must not be blurred. The tasking phrased the second half as 'generate -> rank -> verify -> only VALID executes'. That exact pipeline is NOT stated in the artifact — grep at HML a21fdb7 returns zero hits for it — and P-05 in fact argues the OPPOSITE for the RANKING stage, recommending that validity order candidates rather than gate them. The rule that only a VALID transition may enter trusted state is sound and is this programme's own, resting on D-047's fail-closed certificate boundary, the frame condition (X136) and D-050's trust boundary. It is not a PRM finding and must not be cited as one."
    - "P-05's own recommendation is DEFER, not build: 'do not build before the Gemma experiment. Nothing in HML today needs it, and it would add an untested component to an experiment meant to test representation.' Its risk is H and it is the only proposal in the document that would change the matched experiment by adding a scoring arm."
    - "Single source, one adjudicator, 260 candidates, acknowledged upward bias from stratification."
  activation_cue: >
    Wake if any component proposes a single 'good step' score, or proposes to gate generation on
    validity. Wake also if a learned critic is trained on PRM labels — before training, measure
    the labeler-identity confound, because a critic that beats the baseline may be predicting who
    annotated rather than what is true. And wake if anyone cites this entry as licence to let an
    INVALID transition into trusted state: it is not, and X136 and D-050 are why.
  related: [X20, X84, X89, X135, X140, X141, X143]

- id: X143
  type: dormant_option
  project: cross
  status: deferred
  title: "The no-acceptable-action state — 41.9% of PRM decision points contain no +1 at all, and a planner needs defined behaviour for it"
  summary: >
    generate k -> score -> pick best has no defined behaviour when everything is bad, and on
    this evidence that is not a corner case. NOT IMPLEMENTED, and nothing to build until a
    planner exists; recorded now because it is a hard constraint on any planner that is later
    designed, and it is the kind of constraint that is expensive to retrofit.
  evidence_for:
    - "/Users/moheet/hml_v2_worktree/reports/FINAL_THREE_SOURCE_HML_PROPOSAL.md P-06, verified by the auditor: 41.9% of PRM decision points contain NO +1 candidate. In 40.0% of them a HUMAN wrote the step, because all seven model candidates were rejected."
    - "The report's own classification is 'High for the fact, N/A for the remedy' — the frequency is solid and the response is entirely undesigned."
    - "It composes directly with X141: k was expanded only after failure, so the states with many candidates are the states where the generator was already struggling. 41.9% is the rate at which expansion did not rescue it."
  evidence_against:
    - "The 41.9% is measured on a CONDITIONED SAMPLE, for the same reason recorded in X141, and is therefore not an unconditional rate for any other generator, model or corpus."
    - "P-06's recommendation is DEFER. There is no planner, no action generator and no ranker in either repository, so there is currently nothing that could exhibit this state."
    - "The human-written-step figure describes PRM800K's DATA COLLECTION PROCEDURE. It is evidence that the state occurs; it is not evidence about what an autonomous system should do when it occurs."
  activation_cue: >
    Wake at the design stage of any planner or action generator, before it is built, and require
    a defined outcome for 'no acceptable action exists' — distinct from failure, distinct from
    an empty candidate list, and distinct from silently picking the least bad option. Silently
    picking the least bad option is the specific failure this entry exists to prevent.
  related: [X140, X141, X142, X146]

- id: X144
  type: decision
  project: cross
  status: active
  title: "The AMPS narration filter — 81% of apparent planning language fails a strict deletion test, so do not create kernel operations for it"
  summary: >
    Most of what reads like planning in pedagogical prose is rendering. Under an exhaustive
    121-clause frame with a strict deletion test, only 19% of it carries information the
    adjacent mathematics does not already state. Do not mint kernel operations for
    discourse-marker vocabulary.
  evidence_for:
    - "/Users/moheet/hml_v2_worktree/reports/FINAL_THREE_SOURCE_HML_PROPOSAL.md F-4: AMPS, exhaustive 121-clause frame, strict deletion test, only 19% carries information the adjacent mathematics does not already state. The named categories are section headers (Putting the pieces together), restatements (In conclusion..., 13.4% of rows) and encouragement."
    - "P-08 measures the same conclusion from the other direction: declared multi-step plans occur in just 24 skeletons across 4 topics and are ALWAYS EXECUTED EXACTLY AS DECLARED, never revised. Strategy is chosen once at step 0 and never changes. The recommendation is REJECT a plan or strategy object outright — it would be a write-once decoration."
    - "THE ONE GENUINELY INFORMATIVE PEDAGOGICAL MOVE FOUND IS NOT PLANNING AT ALL. It is guarded method dispatch — 'since the terms share no common monomial factor and the leading coefficient is not 1, factor by grouping' — at 442 skeletons across 55 topics, and it is ALREADY EXPRESSIBLE as Action.preconditions plus Action.warrant. The other is the expandable justification pointer, recorded separately in X145."
    - "This corroborates the corpus's standing prohibition rather than creating a new one: docs/04 §8 and §11.E already forbid adding syntax merely because a planner word has been observed, and X126 reproduces that list."
  evidence_against:
    - "DISCREPANCY RECORDED BY AUDIT PASS 3. The tasking named a specific cue list — notice / first / next / think / observe / realize / now — as the vocabulary not to make operations of. Those seven words do NOT appear as a list anywhere in the artifact; grep at HML a21fdb7 finds no such enumeration. The artifact's actual categories are section headers, In conclusion restatements, encouragement and analogies. The prohibition is well founded; the specific word list is unsourced and is recorded as such rather than quietly adopted."
    - "AMPS ROW COUNTS INFLATE ROUGHLY 9.3x. Khan exercises are template-generated, and blanking mathematics and numerals collapses 103,059 rows to 11,054 distinct solution skeletons. Every AMPS frequency in this entry is a skeleton-level or row-level figure from the source and must be read with that factor in mind."
    - "AMPS PROVENANCE IS THE WEAKEST OF THE THREE SOURCES: a community mirror traced one hop to HF XinyaoHu/AMPS_khan and NOT verified against Hendrycks' official tarball. Its reshaping also flattened per-hint segmentation, so 'steps' there are partly an artefact."
    - "A deletion test measures whether prose is REDUNDANT WITH ADJACENT MATHEMATICS, not whether the underlying cognitive move occurred. 81% narration is a fact about the text, not a refutation of planning."
  activation_cue: >
    Wake whenever a new operation, keyword or syntactic form is proposed on the strength of
    observed language rather than an observed state or control effect. The test is the one used
    here: delete the clause and ask whether any information is lost that the adjacent
    mathematics does not already state. If nothing is lost, it is rendering.
  related: [X55, X56, X60, X61, X69, X88, X126, X145]

- id: X145
  type: architecture
  project: cross
  status: implemented
  title: "Separable warrant — ALREADY IMPLEMENTED, PRESERVE. The only mechanism in the entire evidence base supported by two independent sources"
  summary: >
    A step and its justification are separable objects, with the justification normally
    suppressed and expandable on demand. AMPS expandable justification pointers, Lean decision
    procedures and MiniLang theorem interfaces converge on it. HML already has it. The action
    required is to NOT break it, which is a different and easier obligation than building
    something.
  evidence_for:
    - "/Users/moheet/hml_v2_worktree/reports/FINAL_THREE_SOURCE_HML_PROPOSAL.md §5 Q15, and it is described there as the most sobering line in the document: 'Which proposals have >= 2 independent sources? ONLY the separable warrant (AMPS justification pointers + Lean decision procedures) — and it is already implemented. Everything else is single-source.'"
    - "AMPS SIDE, F-4: expandable justification pointers such as '[Why is this identity true?]' and '[What if I do not see this factorization?]' — 597 distinct, 7.66% of rows. 'A step and its warrant as separable objects, warrant normally suppressed. HML already has this: Action.warrant + EvidenceRecord + the renderer.'"
    - "LEAN SIDE, P-09: Lean cites 66,603 DISTINCT PREMISES across 259,580 steps, while decision procedures (omega, ring, positivity) discharge 100% of their goals while citing ZERO premises. Both facts point the same way — a closed-world warrant registry would be wrong at this scale, and the warrant channel must carry both an open premise vocabulary and opaque procedure calls."
    - "P-09's verdict is CONFIRMED, NO CHANGE. It independently corroborates the decision already recorded in SEMANTIC_STATE_CONTRACT.md that there is deliberately NO warrant-rule registry."
    - "MiniLang is the third, prior source and was not re-audited in this pass: its safety comes from Isabelle elimination and induction theorems and from export callbacks, not from the surface case label — already recorded in X79."
  evidence_against:
    - "IMPLEMENTED IS NOT VALIDATED, and the same contract that carries the mechanism says so. SEMANTIC_STATE_CONTRACT.md §7 defers the theorem half of SF-R10 entirely: 'no fixture names a theorem id, statement or substitution, so building it would add machinery no acceptance case could check.' Replay for the warrant path is deferred for the same reason — the reference checker re-derives nothing."
    - "Convergence of three sources on the SHAPE of the mechanism is not evidence that HML's PARTICULAR realisation of it is adequate. No arm of any experiment has ever been scored on warrant handling."
    - "The warrant channel is exactly where X114's search-displacement risk lives: an open premise vocabulary and opaque decision procedures are what let a small checked kernel coexist with an arbitrarily large hidden search. 66,603 premises and a mean of 64,733 accessible premises per step is the measurement of that hiding place, not a reassurance about it."
  activation_cue: >
    Wake on any proposal that would CLOSE the warrant vocabulary, register warrants centrally,
    enumerate admissible rules, or fold the warrant back into the operation label. All four are
    contradicted by 66,603 distinct premises and by decision procedures that cite none. Wake
    also if a renderer is written that cannot suppress a warrant and expand it on demand, since
    suppression-with-expansion is the half AMPS contributes.
  related: [X79, X80, X86, X104, X114, X137, X144]

- id: X146
  type: dormant_option
  project: cross
  status: dormant
  title: "Failure and repair remain DORMANT — intellectually important, observed by none of the three sources, and now rejected as state machinery on that basis"
  summary: >
    Lakatos-style repair is the most interesting idea in the programme's theoretical inheritance
    and it has zero observational support. Three independent sources, none of which contains
    failure, cannot refute it — their silence is CANNOT MEASURE, never support — but the
    practical consequence is that no search, backtracking or failure-history machinery is
    justified by any evidence this project holds.
  evidence_for:
    - "The theoretical case is unchanged and is preserved in X72, X66, X67, X68, X73, X82, X83 and X87. Nothing in this entry withdraws it."
  evidence_against:
    - "/Users/moheet/hml_v2_worktree/reports/FINAL_THREE_SOURCE_HML_PROPOSAL.md §1: FAILURE/ABANDONMENT and REPAIR/BACKTRACKING are the only two rows of a sixteen-mechanism triangulation matrix marked NOT OBSERVED BY ANY SOURCE. 'The most important row is the last two.'"
    - "AMPS: zero hits for backtrack, zero for seven abandonment phrasings, zero announced case splits, across ALL 103,059 rows, verified by the auditor. PRM800K: records a strictly linear chosen path and nothing whatever about unchosen branches. LeanDojo: contains only SUCCESSFUL proofs."
    - "P-07 accordingly REJECTS as SemanticState fields: search, backtracking, failed-action history, frontier, budget and representation history. 'If these are wanted later they need a source that actually contains failure — none of these three does.' §5 Q11, on what failed history should survive: 'None, on this evidence.'"
    - "The source states the epistemics correctly and they must travel with the rejection: §6, 'Absence of failure evidence is not evidence of absence. All three sources record success.'"
  activation_cue: >
    Two concrete triggers, either of which wakes this entry. FIRST, planner experiments
    repeatedly hit dead ends or action exhaustion — X143's no-acceptable-action state occurring
    in practice is the operational form of this, and 41.9% is the rate at which it occurred in
    PRM. SECOND, a corpus of independent NATURAL-ERROR data becomes available that contains
    genuine failed attempts, counterexamples and repairs, rather than polished successful paths.
    Neither has happened. Until one does, do not add history fields, frontier objects or
    backtracking pointers to trusted state.
  related: [X4, X61, X65, X66, X67, X68, X72, X73, X82, X83, X87, X143]

- id: X147
  type: architecture
  project: cross
  status: dormant
  title: "The interpretation layer stays separate — source language to readings is not interpreted state to inference, and definiteness, reference and ambiguity must never become trusted mathematical opcodes"
  summary: >
    Two different problems that a single pipeline would silently merge. Getting from source
    language to a set of candidate readings is interpretation; getting from an interpreted state
    to a conclusion is inference. Definiteness, reference resolution and ambiguity belong to the
    first and must not be admitted as operations in the trusted kernel of the second.
  evidence_for:
    - "The architectural case is X76's and is unchanged: docs/04 §3 reserves the layer, docs/03 §4 gives the failure taxonomy separating interpretation error from reasoning error from evidence error from task error, and docs/03 §15 records that Gold-125 largely starts AFTER source interpretation."
    - "AUDIT PASS 3, THE NEW AND UNCOMFORTABLE FACT: /Users/moheet/hml_v2_worktree/reports/FINAL_THREE_SOURCE_HML_PROPOSAL.md §1 marks INTERPRETATION with an em-dash in all three columns — 'no source measures it'. It is the only mechanism in the sixteen-row matrix in that position, and it is a strictly weaker position than the two rows marked observed-by-none, because those at least had sources capable of showing it. LeanDojo begins from formalised statements, PRM from a fixed problem prefix, AMPS from templated exercises."
    - "The FormalMATH funnel already recorded in X76 remains the clearest quantification of why the layers must be separate: about 92.4% compiler-valid, 31.7% surviving semantic verification, 30.1% surviving negation filtering, about 21.7% final manually validated. Parses is not preserves meaning is not proves is not answers the task."
  evidence_against:
    - "No interpretation study has been run and no source in the evidence base can support one, so the layer remains RESERVED AND UNBUILT. Its concrete fields (reading_id, semantic_status, scope_status, binding_status, interpretation_constraints, alternative_readings, alignment_evidence) are a sketch and must not be frozen before a source-to-meaning study, per X76."
    - "Recorded so this entry is not read as more than it is: it is a boundary discipline with an unmeasured other side. Nothing establishes how large interpretation error actually is in this programme's own experiments."
  activation_cue: >
    Wake when interpretation or source-alignment errors dominate benchmark failures — that is,
    when a measurable share of losses are traced to the system having read the problem
    differently rather than reasoned about it wrongly. That is precisely the misdiagnosis X76
    exists to prevent, and it is also docs/00 next question 5. Wake immediately, and refuse, if
    any proposal would add definiteness, reference resolution or ambiguity handling as trusted
    kernel operations rather than as an upstream layer producing candidate readings.
  related: [X76, X55, X85, X90, X117]

- id: X148
  type: hypothesis
  project: cross
  status: unresolved
  title: "THREE compression hypotheses, and they must be kept apart — execution compression is strongly supported, semantic compression has some support, discovery compression is unresolved"
  summary: >
    The programme repeatedly says "the core is small". That sentence hides three different
    claims with three different evidence levels, and collapsing them is the most likely way the
    17-operation result becomes a misleading headline. EXECUTION compression, many tactics
    reducing to few state effects, is now strongly supported. SEMANTIC compression, many surface
    forms denoting the same relation, has some support. DISCOVERY compression, many strategic
    moves reducing to a small reusable repertoire, is unresolved and is the one the project
    actually wants.
  evidence_for:
    - "EXECUTION COMPRESSION — STRONGLY SUPPORTED, and it is the largest single measurement in the evidence base. /Users/moheet/hml_v2_worktree/reports/FINAL_THREE_SOURCE_HML_PROPOSAL.md F-1: 254 distinct Lean tactic heads reduce to 6 state-effect classes covering 99.86% of 259,580 steps, residual 13 steps, entropy 4.693 -> 2.050 bits, a 42x reduction. Distribution: DISCHARGE 41.2%, TRANSFORM_TARGET 32.9%, EXTEND_CONTEXT 10.5%, SPLIT 7.1%, TRANSFORM_CONTEXT 5.4%, TRANSFORM_BOTH 2.7%. Independent of HML — Lean's designers were not building it."
    - "SEMANTIC COMPRESSION — SOME SUPPORT. Lean: 185,011 distinct raw tactic strings, 90.5% of them hapax, collapse to 254 heads. MiniLang (X23): 1,519,944 serialized commands over a 17-label vocabulary, 2.726 bits label entropy, effective perplexity 6.616. Gold-125 (X2, X14): 66 observed surface labels adjudicated to 17 accepted core values, top-5 80.19% / top-10 94.89% / top-15 99.52% over 626 accepted-core units. Three sources agree that surface form multiplies faster than meaning does."
    - "DISCOVERY COMPRESSION — UNRESOLVED, and no source in the evidence base can currently settle it. Gold-125's source-visible meta records total 87 in 769 transitions (11.3%), and MATH exposes successful paths only, so failed alternatives cannot be counted at all (X4). The three-source audit adds nothing: planning is 1-source-weak at 24 skeletons across 4 topics, and 81% of apparent planning language is narration (X144)."
  evidence_against:
    - "THE BOUND ON EXECUTION COMPRESSION, from the source itself: the 42x is measured over PRETTY-PRINTED states. Lean's metavariable context, universe levels, instance cache, goal ordering and elided terms never reach the dataset. '42x is an UPPER BOUND on compressibility, not the size of Lean's real state algebra.' Further, 60,973 of 122,517 theorems (49.8%) carry zero traced tactics."
    - "SEARCH DISPLACEMENT APPLIES TO ALL THREE and is the reason they must stay separate — X114. A small checked execution kernel can coexist with an arbitrarily large high-entropy planner. Lean maintains a mean of 64,733 ACCESSIBLE PREMISES per step and cites 66,603 distinct ones; none of that entropy appears in the 2.050-bit effect channel. Compressing execution says nothing about compressing discovery, and the strongest number in this entry is the one furthest from the claim the project cares about."
    - "The unresolved tail bounds the semantic claim: 136/769 (17.685%) UNRESOLVED and 125/769 (16.255%) frozen OTHER in Gold-125, status UNSTABLE_REVIEW_REQUIRED (X17). Saturation can look flat precisely because the hard cases were never labelled."
  activation_cue: >
    Wake whenever a document, abstract or handoff says "the core is small", "reasoning
    compresses", or quotes 17 operations or 42x. Require it to name WHICH of the three
    compressions it means and to carry that one's evidence level. Wake also if anyone proposes
    to treat the Lean 42x as support for the small-core thesis in general: it supports
    execution compression only, and X2 has been annotated accordingly.
  related: [X2, X4, X14, X17, X23, X110, X114, X137, X144]
